<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tríade</title>
<meta name="description" content="Tríade reúne a Horizon Wear e a Aurel Gym em um só lugar. Escolha uma loja para entrar.">
<meta name="theme-color" content="#08080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308080b'/%3E%3Cpath d='M5 25 16 5l11 20-11-7z' fill='none' stroke='%23f5aa13' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#07070a;--panel:#101015;--white:#f7f6f8;--muted:#b6b3c0;
  --gold:#f5ad16;--gold2:#ffcf52;--purple:#791cff;--purple2:#a65cff;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;width:100%}
body{background:var(--bg);color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}
.home{
  position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  padding:clamp(30px,5vw,64px) clamp(18px,4vw,56px) calc(env(safe-area-inset-bottom,0px) + 34px);
  background:
    linear-gradient(115deg,rgba(7,7,10,.91),rgba(7,7,10,.78) 48%,rgba(7,7,10,.91)),
    url("../Img/Triade_Background.png") center/cover no-repeat,
    #07070a;
}
.home:before,.home:after{content:"";position:absolute;z-index:-1;pointer-events:none;inset:-20%;opacity:.28}
.home:before{background:linear-gradient(132deg,transparent 0 13%,rgba(245,173,22,.75) 13.2% 17%,transparent 17.2% 100%);filter:blur(1px)}
.home:after{background:linear-gradient(312deg,transparent 0 13%,rgba(121,28,255,.8) 13.2% 17%,transparent 17.2% 100%)}
.brand{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,22px);margin-bottom:clamp(24px,4vh,42px)}
.brand-mark{width:clamp(48px,6vw,76px);height:auto;filter:drop-shadow(0 0 18px rgba(245,173,22,.22))}
.brand-name{font-size:clamp(2.2rem,6vw,4.3rem);font-weight:800;letter-spacing:.12em;line-height:1}
.brand-name span{color:var(--gold)}
.intro{text-align:center;max-width:1000px}
.intro h1{font-size:clamp(2rem,5.1vw,4.6rem);font-weight:800;line-height:1.08;letter-spacing:-.055em}
.intro h1 span{color:var(--gold)}
.subtitle{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,24px);margin-top:16px;color:#e5e1e9;font-size:clamp(.75rem,1.6vw,1.08rem);font-weight:500;letter-spacing:.38em;text-transform:uppercase}
.subtitle:before,.subtitle:after{content:"";height:1px;width:clamp(34px,12vw,180px);background:linear-gradient(90deg,transparent,var(--gold))}
.subtitle:after{transform:scaleX(-1)}
.stores{width:100%;max-width:1440px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,2.5vw,38px);margin-top:clamp(34px,5vh,54px)}
.store{
  position:relative;display:block;min-width:0;aspect-ratio:1.55/1;overflow:hidden;
  border:1.5px solid var(--gold);border-radius:18px;background:#101015;
  box-shadow:0 12px 40px rgba(0,0,0,.42),0 0 22px rgba(245,173,22,.10);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}
.store--aurel{border-color:var(--purple);box-shadow:0 12px 40px rgba(0,0,0,.42),0 0 22px rgba(121,28,255,.15)}
.store:hover{transform:translateY(-5px);box-shadow:0 18px 54px rgba(0,0,0,.58),0 0 30px rgba(245,173,22,.2)}
.store--aurel:hover{box-shadow:0 18px 54px rgba(0,0,0,.58),0 0 30px rgba(121,28,255,.26)}
.store img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s ease}
.store:hover img{transform:scale(1.025)}
.store:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.store__hint{position:absolute;right:18px;bottom:16px;z-index:2;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:#111;font-size:1.4rem;font-weight:700;box-shadow:0 5px 20px #0008;transition:transform .2s}
.store--aurel .store__hint{background:var(--purple);color:#fff}
.store:hover .store__hint{transform:translateX(3px)}
.foot{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:clamp(24px,4vh,42px);color:#e6e2eb;text-align:center;font-size:clamp(.75rem,1.35vw,.95rem);font-weight:500}
.foot-mark{display:grid;place-items:center;color:var(--gold);font-size:1.55rem;font-weight:800}
.foot:before,.foot:after{content:"";width:clamp(20px,8vw,130px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.foot:after{transform:scaleX(-1)}

/* Visualizador das lojas: comportamento original preservado */
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;min-height:calc(env(safe-area-inset-top,0px) + 58px);padding:env(safe-area-inset-top,0px) 14px 0;background:#09090d;border-bottom:1px solid rgba(255,255,255,.1)}
.bar__home{font-size:1.15rem;font-weight:900;letter-spacing:.12em;padding:8px 14px 8px 5px;margin-right:6px}
.bar__home span{color:var(--gold)}
.tab{padding:9px 16px;border-radius:999px;color:var(--muted);font-weight:600;font-size:.88rem;transition:background .2s,color .2s}
.tab:hover{color:var(--white)}
.tab[aria-current="true"]{background:var(--gold);color:#111}
.tab[data-store="aurel"][aria-current="true"]{background:var(--purple);color:white}
.bar__ext{margin-left:auto;color:var(--muted);font-size:.82rem;text-decoration:none;padding:8px 6px;white-space:nowrap}
.bar__ext:hover{color:var(--white)}
.stage{position:relative;flex:1;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg)}
@media(max-width:760px){
 .home{justify-content:flex-start;padding-top:clamp(40px,9vh,76px)}
 .brand{margin-bottom:28px}
 .stores{grid-template-columns:1fr;max-width:620px;gap:20px;margin-top:30px}
 .store{aspect-ratio:1.5/1;border-radius:14px}
 .subtitle{letter-spacing:.2em}
 .foot{margin-top:28px}
}
@media(max-width:420px){
 .intro h1{font-size:2rem}
 .brand-name{font-size:2.2rem}
 .store{aspect-ratio:1.28/1}
 .bar{gap:2px;padding-left:8px;padding-right:8px}
 .bar__home{font-size:1rem;padding-right:8px}
 .tab{font-size:.75rem;padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="home" id="home">
  <div class="brand" aria-label="Tríade">
    <svg class="brand-mark" viewBox="0 0 100 88" role="img" aria-label="Símbolo Tríade">
      <path d="M8 78 50 8l42 70-42-24z" fill="none" stroke="#f5ad16" stroke-width="9" stroke-linejoin="miter"/>
      <path d="m50 54 20 24H30z" fill="#f7f6f8"/>
    </svg>
    <div class="brand-name">TRÍ<span>A</span>DE</div>
  </div>
  <header class="intro">
    <h1>Escolha uma loja <span>para entrar.</span></h1>
    <p class="subtitle">Duas marcas. Um só grupo.</p>
  </header>

  <div class="stores">
    <button class="store store--horizon" data-store="horizon" type="button" aria-label="Entrar na loja Horizon Wear">
      <img src="../Img/Card-horizonwear.png" alt="Horizon Wear — moda masculina premium">
      <span class="store__hint" aria-hidden="true">›</span>
    </button>
    <button class="store store--aurel" data-store="aurel" type="button" aria-label="Entrar na loja Aurel Gym">
      <img src="../Img/Card_aurelgym.png" alt="Aurel Gym — roupas para treinar">
      <span class="store__hint" aria-hidden="true">›</span>
    </button>
  </div>
  <p class="foot"><span class="foot-mark" aria-hidden="true">⟳</span>Você pode trocar de loja a qualquer momento.</p>
</main>

<section class="viewer" id="viewer" hidden>
  <nav class="bar" aria-label="Lojas">
    <button class="bar__home" id="goHome" type="button" aria-label="Voltar ao início do Tríade">TRÍ<span>A</span>DE</button>
    <button class="tab" data-store="horizon" type="button">Horizon Wear</button>
    <button class="tab" data-store="aurel" type="button">Aurel Gym</button>
    <a class="bar__ext" id="ext" href="#" target="_blank" rel="noopener"><span>Abrir em nova aba</span></a>
  </nav>
  <div class="stage" id="stage"></div>
</section>

<script>
(function(){
  var STORES = {
    horizon: { name: 'Horizon Wear', url: 'https://horizonwear.vercel.app/' },
    aurel:   { name: 'Aurel Gym',    url: 'https://aurelgymjk.vercel.app/' }
  };
  var home = document.getElementById('home');
  var viewer = document.getElementById('viewer');
  var stage = document.getElementById('stage');
  var ext = document.getElementById('ext');
  var frames = {};

  function ensureFrame(key){
    if (frames[key]) return frames[key];
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0';
    var load = document.createElement('div');
    load.className = 'loading';
    load.textContent = 'Carregando ' + STORES[key].name + '…';
    var f = document.createElement('iframe');
    f.title = STORES[key].name;
    f.src = STORES[key].url;
    f.allow = 'payment *; clipboard-write; fullscreen';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.addEventListener('load', function(){ load.remove(); });
    wrap.appendChild(f);
    wrap.appendChild(load);
    stage.appendChild(wrap);
    frames[key] = wrap;
    return wrap;
  }

  function openStore(key){
    home.hidden = true;
    viewer.hidden = false;
    Object.keys(STORES).forEach(function(k){
      if (k === key) ensureFrame(k);
      if (frames[k]) frames[k].hidden = (k !== key);
    });
    document.querySelectorAll('.tab').forEach(function(t){
      t.setAttribute('aria-current', t.dataset.store === key ? 'true' : 'false');
    });
    ext.href = STORES[key].url;
    document.title = STORES[key].name + ' · Tríade';
  }

  function goHome(){
    viewer.hidden = true;
    home.hidden = false;
    document.title = 'Tríade';
  }

  document.querySelectorAll('[data-store]').forEach(function(el){
    el.addEventListener('click', function(){ openStore(el.dataset.store); });
  });
  document.getElementById('goHome').addEventListener('click', goHome);
})();
</script>
</body>
</html>
